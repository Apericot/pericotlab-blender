
services:
  blender:
    image: lscr.io/linuxserver/blender:latest
    container_name: pericotlab-blender
    restart: unless-stopped

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris

    ports:
      - "127.0.0.1:13001:3001"

    volumes:
      - blender_config:/config

    shm_size: "1gb"
    mem_limit: 3g
    cpus: 2.5

volumes:
  blender_config:
    name: pericotlab_blender_config
